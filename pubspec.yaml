name: weather_flutter
description: 基于和风天气API开发的跨平台天气工具 Cloudbranch
publish_to: 'none'
version: 0.0.22

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  path_provider: ^2.1.0
  intl: ^0.18.0
  url_launcher: ^6.2.0
  package_info_plus: ^5.0.0
  flutter_markdown: ^0.6.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/weather_icons/
    - CHANGELOG.md
    - CHANGELOG_ANDROID.md
